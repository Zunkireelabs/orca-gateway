{% extends "base.html" %}
{% block title %}Log in — Orca console{% endblock %}
{% block content %}
<h1>Orca console</h1>
<p class="sub">Enter the shared console secret.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/console/login" style="max-width: 320px;">
  <label for="secret">Secret</label>
  <input type="password" id="secret" name="secret" autofocus required>
  <div class="actions"><button class="primary" type="submit">Log in</button></div>
</form>
{% endblock %}
