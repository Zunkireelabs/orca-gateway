# push to main -> checks -> build image -> push GHCR -> ssh to VPS, pull, recreate -> verify from
# outside. STAGE only. Follows the house pattern (see zunkiree-search-v1 / edgeXcrm deploys).
#
# workflow_dispatch, with an explicit `sha` input -> PROD only, never stage (P2 brief A1). Prod
# never rebuilds: it deploys the image the stage pipeline already built and pushed for that exact
# commit, so "an explicit sha" means "a commit that has already been on main, already built,
# already checked". These two paths never cross: a push never touches prod, a dispatch never
# touches stage.
#
# Safety: this workflow NEVER sends a conversational request. Verification is /health plus
# requests that are rejected before reaching any backend. dental-city's ClinicMD credentials
# are PRODUCTION, so a real turn through this gateway (stage or prod) can make a real appointment.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Full commit sha to deploy to PROD. Must already be on main (checked below) and must
          already have an image at ghcr.io/zunkireelabs/orca-gateway:<sha>, pushed by that
          commit's own push-to-main run -- this workflow never builds on a dispatch.
        required: true

concurrency:
  # One group per environment: a stage push and a prod dispatch never block each other, but two
  # prod dispatches (or two stage pushes) still serialise.
  group: deploy-${{ github.event_name == 'workflow_dispatch' && 'prod' || 'stage' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zunkireelabs/orca-gateway
  STAGE_DOMAIN: orca-gw-stage.zunkireelabs.com
  PROD_DOMAIN: orca-gw.zunkireelabs.com

jobs:
  # Runs for both triggers. On a dispatch it checks out the requested sha (not "whatever ref the
  # dispatch form happened to have selected") and refuses anything not already on main -- prod
  # only ever deploys a commit that already went through the ordinary push-to-main checks once.
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: orca
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ORCA_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/orca
    steps:
      - name: Reject a malformed sha before anything uses it
        if: github.event_name == 'workflow_dispatch'
        env:
          SHA: ${{ inputs.sha }}
        run: |
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "::error::sha input must be exactly 40 lowercase hex characters, got '$SHA'"
            exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}
          fetch-depth: 0
      - name: A prod dispatch may only target a commit already on main
        if: github.event_name == 'workflow_dispatch'
        env:
          SHA: ${{ inputs.sha }}
        run: |
          git merge-base --is-ancestor "$SHA" origin/main || {
            echo "::error::$SHA is not an ancestor of origin/main"; exit 1; }
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -rs

  release-stage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No :latest (too easy to deploy stale code) and no --no-cache (layer cache is fine).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # Prod never builds. It only confirms the image this sha's own push-to-main run already built
  # and pushed is actually pullable -- the same guarantee release-stage gives stage, from a
  # different direction (build-then-trust vs. trust-then-verify).
  validate-image-prod:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm ${{ env.IMAGE }}:${{ github.event.inputs.sha }} exists
        env:
          SHA: ${{ inputs.sha }}
        run: |
          docker manifest inspect "${{ env.IMAGE }}:$SHA" >/dev/null || {
            echo "::error::no image at ${{ env.IMAGE }}:$SHA -- this sha was never pushed to main (or its build failed); nothing to deploy"
            exit 1; }

  # Schema first, then code: the new container needs the tables. Idempotent; a failure here
  # blocks the deploy and the previous build keeps serving. Bootstrap only INSERTS tenants whose
  # slug is absent, so it never overwrites an edit made after the first deploy.
  migrate-stage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: release-stage
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - name: Migrate orca_gw and bootstrap tenants
        env:
          ORCA_DATABASE_URL: ${{ secrets.ORCA_DATABASE_URL }}
        run: |
          if [ -z "$ORCA_DATABASE_URL" ]; then echo "::error::secret ORCA_DATABASE_URL is empty"; exit 1; fi
          uv run python -m orca_gateway.migrate --bootstrap config/bootstrap-tenants

  # P2 brief D2/A1b: prod's own schema, orca_gw_prod, on the same Supabase project. A3: bootstraps
  # from config/bootstrap-tenants-prod, never config/bootstrap-tenants (stage's).
  migrate-prod:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate-image-prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha }}
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - name: Migrate orca_gw_prod and bootstrap tenants
        env:
          ORCA_DATABASE_URL: ${{ secrets.PROD_ORCA_DATABASE_URL }}
          ORCA_DB_SCHEMA: orca_gw_prod
        run: |
          if [ -z "$ORCA_DATABASE_URL" ]; then echo "::error::secret PROD_ORCA_DATABASE_URL is empty"; exit 1; fi
          uv run python -m orca_gateway.migrate --bootstrap config/bootstrap-tenants-prod

  deploy-stage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [release-stage, migrate-stage]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
          ORCA_VOICE_SHARED_SECRET: ${{ secrets.ORCA_VOICE_SHARED_SECRET }}
          ORCA_DATABASE_URL: ${{ secrets.ORCA_DATABASE_URL }}
          ORCA_CONSOLE_SECRET: ${{ secrets.ORCA_CONSOLE_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,ORCA_VOICE_SHARED_SECRET,ORCA_DATABASE_URL,ORCA_CONSOLE_SECRET
          script: |
            set -e   # never `set -x`: this script handles secrets

            for v in GHCR_TOKEN IMAGE_TAG ORCA_VOICE_SHARED_SECRET ORCA_DATABASE_URL ORCA_CONSOLE_SECRET; do
              # [ -n ] only: never ${VAR:-default}, which would print the value.
              if [ -z "$(printenv $v)" ]; then echo "::error::required secret/var $v is empty"; exit 1; fi
            done

            STAGE_DIR="/home/zunkireelabs/devprojects/orca-gateway-stage"
            REPO_URL="https://github.com/Zunkireelabs/orca-gateway.git"
            # HTTPS only (the VPS cannot use git@github.com: URLs). The workflow token is passed as
            # a one-shot header, so it is never written into .git/config or a remote URL.
            AUTH_HDR="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GHCR_TOKEN" | base64 | tr -d '\n')"

            if [ ! -d "$STAGE_DIR/.git" ]; then
              echo "=== First-time bootstrap: cloning repo ==="
              mkdir -p "$STAGE_DIR"
              git -c http.extraheader="$AUTH_HDR" clone "$REPO_URL" "$STAGE_DIR"
            fi
            cd "$STAGE_DIR"

            echo "=== Resetting working tree to origin/main ==="
            # Non-force `git checkout -B` alone PRESERVES uncommitted drift across deploys (the root
            # cause of the recurring "VPS uncommitted edits" incidents). The reset --hard is what
            # actually clobbers it; step 1 first guarantees we are on main.
            git -c http.extraheader="$AUTH_HDR" fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            [ "$(git rev-parse HEAD)" = "$IMAGE_TAG" ] || { echo "::error::checkout is not the commit being deployed"; exit 1; }

            echo "=== Rendering .env from secrets (regenerated every deploy; never hand-edit) ==="
            umask 077
            {
              # Tenants (which brain, which voice, hours, kill switch) are DATA in orca_gw now;
              # there is deliberately no per-tenant setting in this file.
              printf 'ORCA_VOICE_SHARED_SECRET=%s\n' "$ORCA_VOICE_SHARED_SECRET"
              printf 'ORCA_DATABASE_URL=%s\n' "$ORCA_DATABASE_URL"
              printf 'ORCA_CONSOLE_SECRET=%s\n' "$ORCA_CONSOLE_SECRET"
              # P3 brief D2, raised from 1: B0 showed warm clinic turns hold ~0 DB sockets, so
              # Zunkiree stage's 2-socket pool was never actually the ceiling this protected.
              # Chat and voice now share this one ceiling (P3 A1). Never load-test.
              echo "ORCA_VOICE_MAX_CONCURRENT_RUNS=2"
              echo "ORCA_VOICE_RUN_TIMEOUT_S=25.0"
            } > .env
            chmod 600 .env

            echo "=== Pulling ghcr.io/zunkireelabs/orca-gateway:$IMAGE_TAG ==="
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # A brand-new GHCR package can fail with permission_denied:read_package for ~30s
            # after its first push. Retry; do not go changing settings.
            ok=0
            for i in 1 2 3 4 5 6; do
              if docker pull "ghcr.io/zunkireelabs/orca-gateway:$IMAGE_TAG"; then ok=1; break; fi
              echo "pull attempt $i failed, retrying in 15s"; sleep 15
            done
            [ "$ok" = 1 ] || { docker logout ghcr.io || true; echo "::error::image pull failed"; exit 1; }

            echo "=== Recreating service ==="
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d --no-build --force-recreate orca-gateway-stage

            echo "=== Verifying the RUNNING container reports this commit ==="
            for i in 1 2 3 4 5 6; do
              BODY=$(docker exec orca-gateway-stage python -c "import urllib.request;print(urllib.request.urlopen('http://localhost:8000/health').read().decode())" 2>/dev/null || true)
              case "$BODY" in
                *"\"sha\":\"$IMAGE_TAG\""*) echo "container healthy at $IMAGE_TAG"; docker logout ghcr.io || true; exit 0 ;;
              esac
              echo "attempt $i: not ready (${#BODY} bytes), waiting 10s"; sleep 10
            done
            echo "::error::container did not report sha $IMAGE_TAG"
            docker logs orca-gateway-stage --tail 30 | sed -E 's/(Bearer )[^ ]+/\1***/g'
            docker logout ghcr.io || true
            exit 1

  # Mirrors deploy-stage exactly, at its own checkout path / container / compose service, with its
  # own PROD_-prefixed secrets (D6: never copied from stage) and ORCA_DB_SCHEMA/
  # ORCA_VOICE_MAX_CONCURRENT_RUNS set for prod (A1b, A2). Never touches $STAGE_DIR or the stage
  # container.
  deploy-prod:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [validate-image-prod, migrate-prod]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.event.inputs.sha }}
          PROD_VOICE_SHARED_SECRET: ${{ secrets.PROD_VOICE_SHARED_SECRET }}
          PROD_ORCA_DATABASE_URL: ${{ secrets.PROD_ORCA_DATABASE_URL }}
          PROD_CONSOLE_SECRET: ${{ secrets.PROD_CONSOLE_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,PROD_VOICE_SHARED_SECRET,PROD_ORCA_DATABASE_URL,PROD_CONSOLE_SECRET
          script: |
            set -e   # never `set -x`: this script handles secrets

            for v in GHCR_TOKEN IMAGE_TAG PROD_VOICE_SHARED_SECRET PROD_ORCA_DATABASE_URL PROD_CONSOLE_SECRET; do
              # [ -n ] only: never ${VAR:-default}, which would print the value.
              if [ -z "$(printenv $v)" ]; then echo "::error::required secret/var $v is empty"; exit 1; fi
            done

            PROD_DIR="/home/zunkireelabs/devprojects/orca-gateway-prod"
            REPO_URL="https://github.com/Zunkireelabs/orca-gateway.git"
            AUTH_HDR="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GHCR_TOKEN" | base64 | tr -d '\n')"

            if [ ! -d "$PROD_DIR/.git" ]; then
              echo "=== First-time bootstrap: cloning repo ==="
              mkdir -p "$PROD_DIR"
              git -c http.extraheader="$AUTH_HDR" clone "$REPO_URL" "$PROD_DIR"
            fi
            cd "$PROD_DIR"

            echo "=== Checking out the dispatched sha ==="
            git -c http.extraheader="$AUTH_HDR" fetch origin main
            git checkout -B main origin/main
            git reset --hard "$IMAGE_TAG"
            [ "$(git rev-parse HEAD)" = "$IMAGE_TAG" ] || { echo "::error::checkout is not the commit being deployed"; exit 1; }

            echo "=== Pre-flight: no uncommitted drift on the prod checkout ==="
            [ -z "$(git status --porcelain)" ] || { echo "::error::prod checkout has uncommitted drift after reset --hard; investigate before deploying"; exit 1; }

            echo "=== Rendering .env from secrets (regenerated every deploy; never hand-edit) ==="
            umask 077
            {
              printf 'ORCA_VOICE_SHARED_SECRET=%s\n' "$PROD_VOICE_SHARED_SECRET"
              printf 'ORCA_DATABASE_URL=%s\n' "$PROD_ORCA_DATABASE_URL"
              printf 'ORCA_CONSOLE_SECRET=%s\n' "$PROD_CONSOLE_SECRET"
              # P2 brief D2/A1b, A2: prod's own schema, prod's own concurrency cap.
              echo "ORCA_DB_SCHEMA=orca_gw_prod"
              echo "ORCA_VOICE_MAX_CONCURRENT_RUNS=5"
              echo "ORCA_VOICE_RUN_TIMEOUT_S=25.0"
            } > .env
            chmod 600 .env

            echo "=== Pulling ghcr.io/zunkireelabs/orca-gateway:$IMAGE_TAG ==="
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            ok=0
            for i in 1 2 3 4 5 6; do
              if docker pull "ghcr.io/zunkireelabs/orca-gateway:$IMAGE_TAG"; then ok=1; break; fi
              echo "pull attempt $i failed, retrying in 15s"; sleep 15
            done
            [ "$ok" = 1 ] || { docker logout ghcr.io || true; echo "::error::image pull failed"; exit 1; }

            echo "=== Recreating service ==="
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d --no-build --force-recreate orca-gateway-prod

            echo "=== Verifying the RUNNING container reports this commit ==="
            for i in 1 2 3 4 5 6; do
              BODY=$(docker exec orca-gateway-prod python -c "import urllib.request;print(urllib.request.urlopen('http://localhost:8000/health').read().decode())" 2>/dev/null || true)
              case "$BODY" in
                *"\"sha\":\"$IMAGE_TAG\""*) echo "container healthy at $IMAGE_TAG"; docker logout ghcr.io || true; exit 0 ;;
              esac
              echo "attempt $i: not ready (${#BODY} bytes), waiting 10s"; sleep 10
            done
            echo "::error::container did not report sha $IMAGE_TAG"
            docker logs orca-gateway-prod --tail 30 | sed -E 's/(Bearer )[^ ]+/\1***/g'
            docker logout ghcr.io || true
            exit 1

  verify-stage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: deploy-stage
    steps:
      - uses: actions/checkout@v4
      - name: Verify from outside the VPS (no conversational request)
        run: scripts/verify-deploy.sh "$STAGE_DOMAIN" "${{ github.sha }}"

  verify-prod:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: deploy-prod
    steps:
      - uses: actions/checkout@v4
      - name: Verify from outside the VPS (no conversational request)
        env:
          SHA: ${{ inputs.sha }}
        run: scripts/verify-deploy.sh "$PROD_DOMAIN" "$SHA"
